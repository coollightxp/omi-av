name: omi
description: 欧米视听 (Omi) — 跨平台直播视听应用：电视直播、电台、投屏接收。
publish_to: 'none'
version: 2.1.3+17

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 视频播放 - Web 端保留 video_player（HTML video 元素）
  video_player: ^2.8.6
  video_player_web: ^2.3.1

  # Android/Windows/Linux 播放内核：media_kit (libmpv)
  # 自带 HLS/DASH/RTSP 嗅探、HTTP 头透传与断点续传，替代 fvp(MDK)
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  # 状态管理
  provider: ^6.1.2

  # 屏幕亮度控制（Android/iOS/macOS/Windows，2.x 使用 instance API）
  screen_brightness: ^2.1.11

  # 音量控制（多平台，3.x 使用 VolumeController.instance 单例 API）
  volume_controller: ^3.7.1

  # 保持屏幕常亮
  wakelock_plus: ^1.2.5

  # 桌面窗口管理（双击全屏，仅 Windows/macOS/Linux 生效）
  window_manager: ^0.5.2

  # Windows 系统托盘（后台播放/摸鱼模式的容器，仅 Windows 生效）
  system_tray: ^2.0.3

  # 日期时间格式化
  intl: ^0.20.2

  # 网络请求（拉取播放列表/EPG）
  http: ^1.2.1

  # XML 解析（XMLTV 格式 EPG）
  xml: ^6.5.0

  # gzip 解压（.gz 压缩的 EPG 文件）
  archive: ^4.0.2

  # 本地持久化（保存播放列表/EPG 源配置）
  shared_preferences: ^2.2.3

  # 文件路径（录制/截图保存目录）
  path_provider: ^2.1.3

  # 文件选择器（选择本地播放列表文件）
  file_picker: ^13.1.0

  # 多编码解码（部分国内直播源 TXT 为 GBK/ANSI 编码，纯 Dart 全平台兼容）
  fl_charset: ^1.0.2

  # 二维码（设置页展示局域网管理地址，手机扫码编辑直播源/EPG）
  qr_flutter: ^4.1.0

  # 网页频道（TVBox 源里的 webview:// 链接）：Windows/Android/macOS/Web
  # 内嵌网页控件；Linux 回退 url_launcher 打开系统浏览器
  flutter_inappwebview: ^6.1.5

  # 系统浏览器兜底（非 Windows / 无 WebView2 时打开网页频道）
  url_launcher: ^6.3.0

  # 集合工具（firstOrNull 等）
  collection: ^1.18.0

  # FFI 基础库（web_env 用其 calloc 调 WebView2Loader.dll 官方检测接口）
  ffi: ^2.1.0
  share_plus: ^13.3.1
  fvp: ^0.40.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
  assets:
    - branding/icon_1024.png
    - branding/splash.png
    # 网页管理页页头图标（手机扫码页）
    - branding/web/Icon-192.png
    # 内置频道台标（节目源没给 tvg-logo 时按频道名匹配）
    - assets/logos/
    # 出厂内置电台精选（电视伴音 / 央广 / 省市台 / 音乐 / 故事）
    - assets/radio/
    # 出厂内置央视频道（央视网 + 央视频 免费直播页，webview:// 形式）
    - assets/cctv/
    # Windows 系统托盘图标（后台播放/摸鱼模式）
    - assets/tray/
